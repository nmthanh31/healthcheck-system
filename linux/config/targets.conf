#!/usr/bin/env bash

# Các check đặc thù của hệ thống. Hãy thêm đúng dịch vụ thật của bạn ở đây.
# Dùng dấu nháy kép; mỗi phần tử là một check riêng.

# Service systemd bắt buộc phải active.
# Ví dụ: HEALTH_SYSTEMD_SERVICES=("nginx.service" "my-api.service")
HEALTH_SYSTEMD_SERVICES=()

# HTTP health endpoint: "Tên hiển thị|URL".
# Endpoint nên xác minh dependency quan trọng (DB/queue) nếu ứng dụng có hỗ trợ.
# Ví dụ: HEALTH_HTTP_ENDPOINTS=("public-api|https://api.example.com/health")
HEALTH_HTTP_ENDPOINTS=()

# TCP dependency: "Tên hiển thị|host|port".
# Ví dụ: HEALTH_TCP_TARGETS=("postgres|db.internal|5432")
HEALTH_TCP_TARGETS=()

# Backup kiểm tra bằng tuổi file: "Tên hiển thị|đường_dẫn|giới_hạn_giờ".
# Nên dùng file/marker chỉ được tạo sau khi backup thật sự thành công.
# Ví dụ: HEALTH_BACKUP_FILES=("postgres-nightly|/var/backups/postgres/success.marker|26")
HEALTH_BACKUP_FILES=()

# Ngưỡng response-time của endpoint HTTP.
HEALTH_HTTP_WARN_SECONDS="${HEALTH_HTTP_WARN_SECONDS:-2}"
HEALTH_HTTP_CRIT_SECONDS="${HEALTH_HTTP_CRIT_SECONDS:-5}"
