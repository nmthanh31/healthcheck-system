#!/usr/bin/env bash

# Những namespace chỉ chứa workload tạm thời/test có thể bỏ qua ở pod check.
K8S_IGNORED_NAMESPACES=()

# Mỗi mục có dạng: "tier|thư_mục_backup|tuổi_tối_đa_giờ|cần_SUCCESS_marker".
# Healthcheck chỉ tìm file snapshot.db, không coi certificate copy là backup.
# Với cron backup bên dưới, giữ hourly và daily riêng để phát hiện cả hai.
# Ví dụ:
# K8S_ETCD_BACKUP_TARGETS=(
# Với backup script hiện tại (không tạo SUCCESS), đặt false. Healthcheck vẫn
# xác minh snapshot bằng etcdctl và đọc log systemd-cat tag etcd_backup.
#   "hourly|/mnt/nfs_read/etcd/backups/hourly|2|false"
#   "daily|/mnt/nfs_read/etcd/backups/daily|26|false"
# )
K8S_ETCD_BACKUP_TARGETS=()

# Longhorn chỉ được kiểm tra nếu CRD volumes.longhorn.io đang tồn tại.
K8S_CHECK_LONGHORN="true"
