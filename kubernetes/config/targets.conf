#!/usr/bin/env bash

# Những namespace chỉ chứa workload tạm thời/test có thể bỏ qua ở pod check.
K8S_IGNORED_NAMESPACES=()

# Chỉ kiểm tra snapshot etcd nếu có cấu hình backup rõ ràng. RKE2 thường dùng
# /var/lib/rancher/rke2/server/db/snapshots. Đặt rỗng để bỏ qua.
K8S_ETCD_SNAPSHOT_DIR=""
K8S_ETCD_SNAPSHOT_MAX_AGE_HOURS="26"

# Longhorn chỉ được kiểm tra nếu CRD volumes.longhorn.io đang tồn tại.
K8S_CHECK_LONGHORN="true"
